[package]
name = "fotbal-to-je-hra"
version = "0.1.0"
edition = "2021"

# Match the last segment of sk.fotbaltojehra.game and its Java native loader.
[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
macroquad = "0.4.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = { version = "1.4", features = ["import"] }

[package.metadata.android]
package_name = "sk.fotbaltojehra.game"
label = "Fotbal To Je Hra"
version_code = 8
android_version = 36
target_sdk_version = 36
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]
fullscreen = true
opengles_version_major = 2
opengles_version_minor = 0

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "sensorLandscape"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

# Named binaries do not inherit package_name/label from the root metadata.
[[package.metadata.android.bin]]
name = "game"
package_name = "sk.fotbaltojehra.game"
label = "Fotbal To Je Hra"
