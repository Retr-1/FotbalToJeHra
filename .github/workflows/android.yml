name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'assets/generated/**'
      - 'assets/models/ball.glb'
      - 'Cargo.*'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - name: SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install compatible APK builder
        run: cargo install --git https://github.com/hoklims/cargo-quad-apk --rev bdb61325ce1aecf09ed8969690f53c86c846c118 --locked cargo-quad-apk
      - name: Tests
        run: cargo test --locked
      - name: Build native ARM64 APK
        run: cargo quad-apk build --release
      - name: Verify APK signatures
        run: |
          for apk in target/android-artifacts/release/apk/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fotbal-android-arm64
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
